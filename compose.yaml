name: livestar

# Development only: all published ports bind loopback. Production requires
# separately provisioned secrets, TLS, private data services and backups.
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-livestar}
      POSTGRES_USER: ${POSTGRES_USER:-livestar_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.6-bookworm
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: livestar-api:local
    command: ["npm", "--prefix", "/app", "run", "db:deploy"]
    environment:
      DATABASE_URL: postgresql://livestar_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-livestar}?schema=public
      DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER:-livestar_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-livestar}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [app]
    image: livestar-api:local
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "4000"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://livestar_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-livestar}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-livestar}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-livestar-clients}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: ${SMTP_FROM:-noreply@livestar.local}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://127.0.0.1:7880}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-livestar_local_dev_secret_change_me_32plus}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  minio:
    profiles: [storage]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-livestar_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set a local MinIO password in .env}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object_data:/data
    restart: unless-stopped

  mailpit:
    profiles: [app, mail]
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  livekit:
    profiles: [media]
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml", "--dev"]
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:50000-50100:50000-50100/udp"
    volumes:
      - ./infra/livekit/livekit.local.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    profiles: [gateway]
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  object_data:
